<!DOCTYPE html>
<html lang="en">
<head>
    <title>User & Accuracy Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Dashboard: Statistics Management</h1>

<div class="container">
    <div class="card">
        <h2>Prediction Accuracy</h2>

        <div>
            <p class="stat" id="totalPredictions">--</p>
            <p class="label">Total Predictions</p>
        </div>

        <div>
            <p class="stat" id="correctPredictions">--</p>
            <p class="label">Correct Predictions</p>
        </div>

        <div>
            <p class="stat" id="accuracyPercentage">--%</p>
            <p class="label">Accuracy Percentage</p>
        </div>

        <canvas id="accuracyChart" width="300" height="300"></canvas>
        <p id="status-accuracy">Loading data...</p>

    </div>

    <div class="card">
        <h2>Accuracy per Breed</h2>
        <div id="breedChartsContainer" class="grid-chart-container"></div>
    </div>

    <div class="card">
        <h2>Files Received per Breed</h2>
        <div id="breedProgressBarsContainer" style="max-width: 600px; margin-top: 20px;"></div>
    </div>

</div>

<script type="module" src="../models/main.js"></script>

</body>
</html>
