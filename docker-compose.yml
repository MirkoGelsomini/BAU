services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./backend/temp:/app/temp
      - ./backend/sounds:/app/sounds
    environment:
      - POPULATE_DB=false
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=bau-password
      - DB_NAME=bau-database
      - BASE_URL=http://localhost:3000
    depends_on:
      - db

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3001"
    volumes:
      - ./dashboard/dashboard.js:/app/dashboard.js
      - ./dashboard/src:/app/src
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=bau-password
      - DB_NAME=bau-database
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bau-password
      MYSQL_DATABASE: bau-database
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
